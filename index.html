    <!-- Theme as in src/hooks/use-theme.ts, before the first paint so it never flashes -->
    <script>
      (function () {
        var stored = null;
        try {
          stored = localStorage.getItem("theme");
        } catch (e) {}
        var dark = stored ? stored === "dark" : window.matchMedia("(prefers-color-scheme: dark)").matches;
        document.documentElement.classList.toggle("dark", dark);
        // Lets CSS hide what only works with JavaScript, like "Show all projects" (the js: variant)
        document.documentElement.classList.add("js");
      })();
    </script>
  </head>
  <body>
    <!-- scripts/build.mjs puts the prerendered page in here -->
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
