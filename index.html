    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <meta name="theme-color" content="#0d0d0c" media="(prefers-color-scheme: dark)" />

    <meta name="twitter:card" content="summary_large_image" />

    <!-- Same rule as src/hooks/use-theme.ts, before the first paint so the theme never flashes -->
    <script>
      (function () {
        var stored = null;
        try {
          stored = localStorage.getItem("theme");
        } catch (e) {}
        var dark = stored ? stored === "dark" : window.matchMedia("(prefers-color-scheme: dark)").matches;
        document.documentElement.classList.toggle("dark", dark);
      })();
    </script>
  </head>
  <body>
    <noscript>
      <p style="padding: 2rem; font: 1.25rem/1.6 sans-serif">
        This site needs JavaScript. My projects are on
        <a href="https://github.com/bearkillerPT">GitHub</a>.
      </p>
    </noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
